<style>
.at-card { font-family: 'IBM Plex Sans', Arial, sans-serif; background: #fff; border: 1px solid #e0e0e0; border-radius: 4px; overflow: hidden; }
.at-header { background: #f4f4f4; border-bottom: 1px solid #e0e0e0; padding: 12px 16px; }
.at-header-title { margin: 0; font-size: 14px; font-weight: 600; color: #161616; }
.at-list { position: relative; padding: 0 0 0 48px; }
.at-list::before { content:''; position: absolute; left: 23px; top: 0; bottom: 0; width: 2px; background: #e0e0e0; }
.at-event { position: relative; padding: 14px 16px 14px 0; border-bottom: 1px solid #f4f4f4; }
.at-event.highlighted { background: #edf4ff; }
.at-dot { position: absolute; left: -34px; top: 18px; width: 14px; height: 14px; border-radius: 50%; background: #8d8d8d; border: 2px solid #fff; box-shadow: 0 0 0 2px #8d8d8d; }
.at-dot.highlighted { background: #0043ce; box-shadow: 0 0 0 2px #0043ce; }
.at-dot.approved { background: #198038; box-shadow: 0 0 0 2px #198038; }
.at-event-header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
.at-actor { font-size: 13px; font-weight: 600; color: #161616; }
.at-action-badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 10px; background: #e0e0e0; color: #525252; }
.at-timestamp { font-size: 11px; color: #8d8d8d; margin-left: auto; }
.at-detail { font-size: 12px; color: #525252; line-height: 1.5; }
</style>
<div class="SPARKPanel panel">
  <div class="widget-heading"><span class="widget-title">Audit Timeline Preview</span></div>
  <div class="widget-body"></div>
</div>
