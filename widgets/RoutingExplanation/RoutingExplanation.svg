<svg width="120" height="120" xmlns="http://www.w3.org/2000/svg">
  <rect width="120" height="120" fill="#ffffff"/>
  <!-- Card -->
  <rect x="10" y="10" width="100" height="100" rx="4" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.5"/>
  <!-- Header -->
  <rect x="10" y="10" width="100" height="22" rx="4" fill="#f4f4f4" stroke="#e0e0e0" stroke-width="1"/>
  <!-- Warning icon -->
  <polygon points="20,28 26,17 32,28" fill="none" stroke="#f1c21b" stroke-width="1.5"/>
  <text x="26" y="26" font-family="IBM Plex Sans, Arial" font-size="7" font-weight="700" fill="#f1c21b" text-anchor="middle">!</text>
  <text x="36" y="25" font-family="IBM Plex Sans, Arial" font-size="8" font-weight="600" fill="#161616">Routing Rule Triggered</text>
  <rect x="80" y="14" width="26" height="12" rx="6" fill="#e0e0e0"/>
  <text x="93" y="23" font-family="IBM Plex Sans, Arial" font-size="6" fill="#525252" text-anchor="middle">FIN-2024</text>
  <!-- Explanation -->
  <text x="16" y="44" font-family="IBM Plex Sans, Arial" font-size="7" fill="#525252">Contract exceeds standard</text>
  <text x="16" y="53" font-family="IBM Plex Sans, Arial" font-size="7" fill="#525252">approval threshold...</text>
  <!-- Threshold boxes -->
  <rect x="16" y="60" width="40" height="24" rx="3" fill="#f4f4f4"/>
  <text x="36" y="71" font-family="IBM Plex Sans, Arial" font-size="6" font-weight="600" fill="#525252" text-anchor="middle">AMOUNT</text>
  <text x="36" y="80" font-family="IBM Plex Sans, Arial" font-size="8" font-weight="700" fill="#da1e28" text-anchor="middle">$125k</text>
  <rect x="62" y="60" width="40" height="24" rx="3" fill="#f4f4f4"/>
  <text x="82" y="71" font-family="IBM Plex Sans, Arial" font-size="6" font-weight="600" fill="#525252" text-anchor="middle">THRESHOLD</text>
  <text x="82" y="80" font-family="IBM Plex Sans, Arial" font-size="8" font-weight="700" fill="#161616" text-anchor="middle">$100k</text>
  <!-- Next action -->
  <text x="16" y="97" font-family="IBM Plex Sans, Arial" font-size="7" font-weight="600" fill="#525252">Recommended: </text>
  <text x="78" y="97" font-family="IBM Plex Sans, Arial" font-size="7" fill="#0043ce" text-decoration="underline">Escalate</text>
</svg>
