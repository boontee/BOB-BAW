<svg width="120" height="120" xmlns="http://www.w3.org/2000/svg">
  <rect width="120" height="120" fill="#ffffff"/>
  <!-- Track -->
  <line x1="15" y1="60" x2="105" y2="60" stroke="#e0e0e0" stroke-width="3"/>
  <!-- Completed connector -->
  <line x1="15" y1="60" x2="55" y2="60" stroke="#198038" stroke-width="3"/>
  <!-- Stage 1: completed -->
  <circle cx="15" cy="60" r="10" fill="#198038"/>
  <path d="M11 60l3 3 6-6" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="15" y="79" font-family="IBM Plex Sans, Arial" font-size="7" fill="#525252" text-anchor="middle">Submit</text>
  <!-- Stage 2: completed -->
  <circle cx="40" cy="60" r="10" fill="#198038"/>
  <path d="M36 60l3 3 6-6" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="40" y="79" font-family="IBM Plex Sans, Arial" font-size="7" fill="#525252" text-anchor="middle">Review</text>
  <!-- Stage 3: current -->
  <circle cx="65" cy="60" r="10" fill="#0043ce"/>
  <text x="65" y="64" font-family="IBM Plex Sans, Arial" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="65" y="79" font-family="IBM Plex Sans, Arial" font-size="7" fill="#0043ce" font-weight="600" text-anchor="middle">Approve</text>
  <!-- Stage 4: pending -->
  <circle cx="90" cy="60" r="10" fill="#ffffff" stroke="#8d8d8d" stroke-width="2"/>
  <text x="90" y="64" font-family="IBM Plex Sans, Arial" font-size="9" fill="#525252" text-anchor="middle">4</text>
  <text x="90" y="79" font-family="IBM Plex Sans, Arial" font-size="7" fill="#525252" text-anchor="middle">Complete</text>
  <!-- CTA button -->
  <rect x="28" y="90" width="64" height="18" rx="4" fill="#0043ce"/>
  <text x="60" y="103" font-family="IBM Plex Sans, Arial" font-size="9" font-weight="600" fill="#ffffff" text-anchor="middle">Submit for Approval</text>
</svg>
