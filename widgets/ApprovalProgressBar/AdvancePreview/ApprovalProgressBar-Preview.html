<style>
.apb-wrapper { font-family: 'IBM Plex Sans', Arial, sans-serif; background: #fff; border: 1px solid #e0e0e0; border-radius: 4px; padding: 16px 20px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.apb-stages { display: flex; align-items: center; flex: 1; min-width: 0; }
.apb-node { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.apb-circle { width: 32px; height: 32px; border-radius: 50%; border: 2px solid #8d8d8d; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #525252; }
.apb-circle.completed { background: #198038; border-color: #198038; color: #fff; }
.apb-circle.current { background: #0043ce; border-color: #0043ce; color: #fff; }
.apb-stage-label { font-size: 11px; color: #525252; text-align: center; }
.apb-stage-label.current { color: #0043ce; font-weight: 600; }
.apb-connector { flex: 1; height: 2px; background: #e0e0e0; min-width: 20px; max-width: 60px; margin-bottom: 18px; }
.apb-connector.completed { background: #198038; }
.apb-cta-btn { padding: 10px 20px; font-size: 14px; font-weight: 600; background: #0043ce; color: #fff; border: none; border-radius: 4px; cursor: pointer; white-space: nowrap; }
</style>
