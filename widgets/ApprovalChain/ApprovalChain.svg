<svg width="120" height="120" xmlns="http://www.w3.org/2000/svg">
  <rect width="120" height="120" fill="#ffffff"/>
  <rect x="10" y="10" width="100" height="100" rx="4" fill="#ffffff" stroke="#8d8d8d" stroke-width="1.5"/>
  <rect x="10" y="10" width="100" height="20" rx="4" fill="#f4f4f4" stroke="#e0e0e0" stroke-width="1"/>
  <text x="18" y="24" font-family="IBM Plex Sans, Arial" font-size="9" font-weight="600" fill="#161616">Approval Chain</text>
  <!-- Layer 1 -->
  <text x="14" y="42" font-family="IBM Plex Sans, Arial" font-size="7" font-weight="600" fill="#525252">LAYER 1</text>
  <circle cx="30" cy="58" r="10" fill="#198038"/>
  <text x="30" y="62" font-family="IBM Plex Sans, Arial" font-size="8" font-weight="700" fill="#fff" text-anchor="middle">A</text>
  <text x="44" y="55" font-family="IBM Plex Sans, Arial" font-size="7" font-weight="600" fill="#161616">Alice Chen</text>
  <text x="44" y="64" font-family="IBM Plex Sans, Arial" font-size="6" fill="#525252">Manager</text>
  <rect x="82" y="52" width="24" height="10" rx="5" fill="#d4edda"/>
