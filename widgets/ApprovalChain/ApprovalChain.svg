  <text x="44" y="104" font-family="IBM Plex Sans, Arial" font-size="6" fill="#525252">Director</text>
  <rect x="82" y="92" width="24" height="10" rx="5" fill="#d0e2ff"/>
  <text x="94" y="99" font-family="IBM Plex Sans, Arial" font-size="6" fill="#0043ce" text-anchor="middle">Current</text>
