<style>
/* Standalone preview styles — mirrors InlineCSS.css */
body {
  font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif;
  background: #f4f4f4;
  margin: 0;
  padding: 2rem;
}

.preview-wrapper {
  max-width: 560px;
  margin: 0 auto;
  background: #ffffff;
  border-radius: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.12);
  padding: 2rem;
}

h2 {
  font-size: 18px;
  font-weight: 600;
  color: #161616;
  margin: 0 0 1.5rem 0;
}

/* controls */
.preview-controls {
  display: flex;
  align-items: center;
  gap: 1rem;
  margin-bottom: 2rem;
  flex-wrap: wrap;
}
.preview-controls label { font-size: 14px; color: #525252; }
.preview-controls input[type=range] { flex: 1; min-width: 160px; }
.preview-controls span { font-size: 14px; font-weight: 600; color: #161616; min-width: 36px; }

/* Widget styles */
.myprogressbar_maincontentbox {
  width: 100%;
  padding: 0;
  font-family: inherit;
}
.myprogressbar_maincontentbox .myprogressbar-container {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}
.myprogressbar_maincontentbox .myprogressbar-percentage {
  display: flex;
  justify-content: center;
}
.myprogressbar_maincontentbox .mypb-percentage-value {
  font-size: 32px;
  font-weight: 600;
  transition: color 0.3s ease;
}
.myprogressbar_maincontentbox .mypb-percentage-value.state-low      { color: #da1e28; }
.myprogressbar_maincontentbox .mypb-percentage-value.state-moderate { color: #f1c21b; }
.myprogressbar_maincontentbox .mypb-percentage-value.state-high     { color: #24a148; }

.myprogressbar_maincontentbox .myprogressbar-track {
  width: 100%; height: 8px;
  background: #e0e0e0;
  border-radius: 4px;
  overflow: hidden;
  box-shadow: inset 0 1px 2px rgba(0,0,0,0.1);
}
.myprogressbar_maincontentbox .myprogressbar-fill {
  height: 100%; width: 0%;
  border-radius: 4px;
  transition: width 0.5s ease-in-out, background-color 0.3s ease;
  position: relative; overflow: hidden;
}
.myprogressbar_maincontentbox .myprogressbar-fill::after {
  content: ''; position: absolute;
  top: 0; left: -100%; width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  animation: mypb-shimmer 2s infinite;
}
@keyframes mypb-shimmer { 0% { left:-100%; } 100% { left:100%; } }

.myprogressbar_maincontentbox .myprogressbar-fill.state-low      { background-color: #da1e28; }
.myprogressbar_maincontentbox .myprogressbar-fill.state-moderate { background-color: #f1c21b; }
.myprogressbar_maincontentbox .myprogressbar-fill.state-high     { background-color: #24a148; }

.myprogressbar_maincontentbox .myprogressbar-status {
  display: flex;
  justify-content: center;
}
.myprogressbar_maincontentbox .mypb-status-message {
  font-size: 14px; font-weight: 400;
  text-align: center;
  padding: 0.375rem 0.875rem;
  border-radius: 4px;
  transition: background-color 0.3s ease, color 0.3s ease;
}
.myprogressbar_maincontentbox .mypb-status-message.state-not-started {
  background: #f4f4f4; color: #525252;
}
.myprogressbar_maincontentbox .mypb-status-message.state-in-progress {
  background: #e5f6ff; color: #0043ce;
  animation: mypb-pulse 2s ease-in-out infinite;
}
.myprogressbar_maincontentbox .mypb-status-message.state-complete {
  background: #defbe6; color: #0e6027;
}
@keyframes mypb-pulse { 0%,100% { opacity:1; } 50% { opacity:0.7; } }
</style>

<div class="preview-wrapper">
  <h2>MyProgressBar — Preview</h2>

  <div class="preview-controls">
    <label for="mypb-slider">Value:</label>
    <input id="mypb-slider" type="range" min="0" max="100" value="0"
           oninput="mypbUpdate(this.value)">
    <span id="mypb-slider-label">0</span>
  </div>

  <!-- Widget markup (mirrors Layout.html) -->
  <div class="myprogressbar_maincontentbox" role="region" aria-label="Progress indicator">
    <div class="myprogressbar-container">
      <div class="myprogressbar-percentage" aria-live="polite">
        <span id="mypb-pct" class="mypb-percentage-value state-low">0%</span>
      </div>
      <div id="mypb-track" class="myprogressbar-track"
           role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="mypb-fill" class="myprogressbar-fill state-low"></div>
      </div>
      <div class="myprogressbar-status" aria-live="polite">
        <span id="mypb-status" class="mypb-status-message state-not-started">Not started</span>
      </div>
    </div>
  </div>
</div>

<script>
function mypbUpdate(v) {
  v = Math.max(0, Math.min(100, parseInt(v, 10) || 0));

  var colorState  = v < 50 ? "state-low" : v < 75 ? "state-moderate" : "state-high";
  var statusState = v === 0 ? "state-not-started" : v < 100 ? "state-in-progress" : "state-complete";
  var statusText  = v === 0 ? "Not started" : v < 100 ? "In progress..." : "Complete";

  var fill   = document.getElementById("mypb-fill");
  var pct    = document.getElementById("mypb-pct");
  var status = document.getElementById("mypb-status");
  var track  = document.getElementById("mypb-track");
  var label  = document.getElementById("mypb-slider-label");

  fill.style.width = v + "%";
  ["state-low","state-moderate","state-high"].forEach(function(c) {
    fill.classList.remove(c); pct.classList.remove(c);
  });
  ["state-not-started","state-in-progress","state-complete"].forEach(function(c) {
    status.classList.remove(c);
  });
  fill.classList.add(colorState);
  pct.classList.add(colorState);
  status.classList.add(statusState);

  pct.textContent    = v + "%";
  status.textContent = statusText;
  label.textContent  = v;

  track.setAttribute("aria-valuenow",  v);
  track.setAttribute("aria-valuetext", v + "% — " + statusText);
}
</script>
