<div class="myprogressbar_maincontentbox" role="region" aria-label="Progress indicator">
  <div class="myprogressbar-container">
    <!-- Percentage display -->
    <div class="myprogressbar-percentage" aria-live="polite">
      <span class="mypb-percentage-value">0%</span>
    </div>

    <!-- Progress bar track -->
    <div class="myprogressbar-track" role="progressbar"
         aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="myprogressbar-fill"></div>
    </div>

    <!-- Status message -->
    <div class="myprogressbar-status" aria-live="polite">
      <span class="mypb-status-message">Not started</span>
    </div>
  </div>
</div>
