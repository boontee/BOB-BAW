<style>
.aap-card { font-family: 'IBM Plex Sans', Arial, sans-serif; background: #fff; border: 1px solid #e0e0e0; border-radius: 4px; overflow: hidden; }
.aap-header { background: #f4f4f4; border-bottom: 1px solid #e0e0e0; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
.aap-header-title { margin: 0; font-size: 14px; font-weight: 600; color: #161616; }
.aap-layer-badge { font-size: 12px; color: #525252; background: #e0e0e0; padding: 2px 8px; border-radius: 10px; }
.aap-body { padding: 16px; }
.aap-context { font-size: 13px; color: #525252; background: #e5f0ff; border-left: 3px solid #0043ce; padding: 10px 12px; margin-bottom: 16px; border-radius: 0 4px 4px 0; }
.aap-comment-label { display: block; font-size: 12px; font-weight: 600; color: #525252; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
.aap-comment-textarea { width: 100%; min-height: 70px; padding: 10px 12px; font-size: 14px; font-family: inherit; color: #161616; background: #fff; border: 1px solid #8d8d8d; border-radius: 4px; resize: vertical; box-sizing: border-box; }
.aap-actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
.aap-btn { padding: 10px 20px; font-size: 14px; font-weight: 600; border: none; border-radius: 4px; cursor: pointer; }
.aap-btn-primary { background: #0043ce; color: #fff; }
.aap-btn-danger { background: #da1e28; color: #fff; }
.aap-btn-secondary { background: #f4f4f4; color: #161616; border: 1px solid #e0e0e0; }
</style>
<div class="SPARKPanel panel">

  <div class="widget-body"></div>
</div>
